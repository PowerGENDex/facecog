name: Build & Deploy ke GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            svelte-demo/package-lock.json
      - run: npm ci
      - run: npm run build

      # Demo login passkey + absensi (SvelteKit), served at /<repo>/demo/
      - name: Test & build svelte-demo
        working-directory: svelte-demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}/demo
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          cp -r build ../dist/demo
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  # Deploy hanya dari branch default repo.
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
